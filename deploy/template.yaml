            Stat: Minimum

  FEHighContainerTaskCountWarningTGW:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarmsSpokeVpc
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-FEHighContainerTaskCountWarningTGW"
      AlarmDescription: !Sub
        - "Spoke VPC service task count reached the auto-scaling maximum for 5 minutes. Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: true
      OKActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      AlarmActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      InsufficientDataActions: []
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 13
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: containerTaskCount
          ReturnData: true
          MetricStat:
