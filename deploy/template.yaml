Outputs:
  StackName:
    Description: "CloudFormation stack name"
    Value: !Sub "${AWS::StackName}"

  FrontUrl:
    Description: >-
      The API Gateway URL which Check Front can be invoked on.
    Value: !GetAtt ApiGwHttpEndpoint.ApiEndpoint

  FrontGatewayId:
    Description: Check Front API Gateway ID
    Export:
      Name: !Sub "${AWS::StackName}-GatewayId"
    Value: !Ref ApiGwHttpEndpoint

  LoadBalancerArn:
    Description: The Fargate Front End Load Balancer ARN
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancer"
    Value: !Ref LoadBalancer

  LoadBalancerTGWArn:
    Description: The Fargate Front End spoke VPC Load Balancer ARN
    Condition: UseSpokeVpc
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerTGW"
    Value: !Ref LoadBalancerTGW

  LoadBalancerTGWDnsName:
    Description: The Fargate Front End spoke VPC Load Balancer DNS name
    Condition: UseSpokeVpc
    Value: !GetAtt LoadBalancerTGW.DNSName

  FrontUrlTGW:
    Description: The API Gateway URL for the spoke VPC frontend (for pre-merge testing without CloudFront)
    Condition: UseSpokeVpcPreMerge
    Value: !GetAtt ApiGwHttpEndpointTGW.ApiEndpoint
