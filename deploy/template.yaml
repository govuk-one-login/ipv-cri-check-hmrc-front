  FELowContainerTaskCountCriticalAlarmTGW:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarmsSpokeVpc
    Properties:
      AlarmName: !Sub "${AWS::StackName}-FELowContainerTaskCountCriticalAlarmTGW"
      AlarmDescription: !Sub
        - "Critical alert, spoke VPC service running container task count droped below 1. Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: false # mirrors FELowContainerTaskCountCriticalAlarm, enable once proved stable in production
      AlarmActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      OKActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      InsufficientDataActions: []
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: LessThanOrEqualToThreshold
      TreatMissingData: breaching
      Metrics:
        - Id: containerTaskCount
          ReturnData: true
          MetricStat:
            Metric:
              Namespace: ECS/ContainerInsights
              MetricName: RunningTaskCount
              Dimensions:
                - Name: ClusterName
                  Value: !Ref EcsClusterTGW
                - Name: ServiceName
                  Value: !GetAtt EcsServiceTGW.Name
            Period: 60
            Stat: Maximum

  # Spoke VPC traffic does not pass through ApiGwHttpEndpoint, so the
  # API Gateway based request alarms (FE5XXErrorCriticalAlarm, FE4XXErrorAlarm,
  # FELatencyAlarmP95, FELatencyAlarmP99) are mirrored here using the spoke
  # load balancer metrics, with the same thresholds.
  FE5XXErrorCriticalAlarmTGW:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarmsSpokeVpc
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-FE5XXErrorCriticalAlarmTGW"
      AlarmDescription: !Sub
        - "Spoke VPC load balancer 5XX threshold exceeds 80% with a minimum of at least 5 requests in 2 out of the last 5 evaluation periods of (15mins each). Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: true
      AlarmActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      OKActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      EvaluationPeriods: 5
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: errorThreshold
          Label: errorThreshold
          ReturnData: true
          Expression: IF(invocations >= 5, errorPercentage, 0)
        - Id: errorPercentage
          Label: errorPercentage
          ReturnData: false
          Expression: ((FILL(targetError, 0) + FILL(elbError, 0)) / invocations) * 100
        - Id: invocations
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: RequestCount
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancerTGW.LoadBalancerFullName
            Period: 900
            Stat: Sum
        - Id: targetError
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancerTGW.LoadBalancerFullName
            Period: 900
            Stat: Sum
        - Id: elbError
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_ELB_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancerTGW.LoadBalancerFullName
            Period: 900
            Stat: Sum

  FE4XXErrorAlarmTGW:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarmsSpokeVpc
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-FE4XXErrorAlarmTGW"
      AlarmDescription: !Sub
        - "Spoke VPC load balancer 4XX threshold exceeds 5% with a minimum of 150 requests and a minimum of 2 errors in 2 out of the last 5 minutes. Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: true
      OKActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      AlarmActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      InsufficientDataActions: []
      EvaluationPeriods: 5
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: errorThreshold
          Label: errorThreshold
          ReturnData: true
          Expression: IF(invocations<150 || error<2,0,errorPercentage)
        - Id: error
          Label: error
          ReturnData: false
          Expression: FILL(targetError, 0) + FILL(elbError, 0)
        - Id: invocations
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: RequestCount
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancerTGW.LoadBalancerFullName
            Period: 60
            Stat: Sum
        - Id: targetError
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_4XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancerTGW.LoadBalancerFullName
            Period: 60
            Stat: Sum
        - Id: elbError
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_ELB_4XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancerTGW.LoadBalancerFullName
            Period: 60
            Stat: Sum
        - Id: errorPercentage
          Label: errorPercentage
          ReturnData: false
          Expression: (error/invocations) * 100

  # TargetResponseTime is reported in seconds (API Gateway Latency is in
  # milliseconds), so the thresholds are 1 and 2.5 rather than 1000 and 2500.
  FELatencyAlarmP95TGW:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarmsSpokeVpc
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-FELatencyAlarmP95TGW"
      AlarmDescription: !Sub
        - "Trigger the alarm if less than 95% of spoke VPC load balancer requests has a target response time of more than 1 second with a minimum of 25 requests in 2 out of the last 5 minutes. Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: false # mirrors FELatencyAlarmP95
      OKActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      AlarmActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      InsufficientDataActions: []
      EvaluationPeriods: 5
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: latencyThreshold
          Label: latencyThreshold
          ReturnData: true
          Expression: IF(invocations<25,0,latency95Percentile)
        - Id: invocations
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: RequestCount
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancerTGW.LoadBalancerFullName
            Period: 60
            Stat: Sum
        - Id: latency95Percentile
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: TargetResponseTime
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancerTGW.LoadBalancerFullName
            Period: 60
            Stat: p95

  FELatencyAlarmP99TGW:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarmsSpokeVpc
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-FELatencyAlarmP99TGW"
      AlarmDescription: !Sub
        - "Trigger the alarm if less than 99% of spoke VPC load balancer requests have a target response time of more than 2.5 second with a minimum of 150 requests in 2 out of the last 5 minutes. Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: false # mirrors FELatencyAlarmP99
      OKActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      AlarmActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      InsufficientDataActions: []
      EvaluationPeriods: 5
      DatapointsToAlarm: 2
      Threshold: 2.5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: latencyThreshold
          Label: latencyThreshold
          ReturnData: true
          Expression: IF(invocations<150,0,latency99Percentile)
        - Id: invocations
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: RequestCount
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancerTGW.LoadBalancerFullName
            Period: 60
            Stat: Sum
        - Id: latency99Percentile
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: TargetResponseTime
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancerTGW.LoadBalancerFullName
            Period: 60
            Stat: p99

