                - Name: ServiceName
                  Value: !GetAtt EcsServiceTGW.Name
            Period: 60
            Stat: Minimum

  # The cluster-level task count alarms count tasks from both services, so
  # they would not fire if only the spoke service lost all of its tasks.
  NoRunningTaskCountAlarmTGW:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarmsSpokeVpc
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-NoRunningTaskCountAlarmTGW"
      AlarmDescription: !Sub
        - "Check HMRC ${Environment} frontend spoke VPC service has no running ECS tasks. Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: true
      AlarmActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      OKActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      InsufficientDataActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      MetricName: RunningTaskCount
      Namespace: ECS/ContainerInsights
      Statistic: Average
      Dimensions:
        - Name: ClusterName
          Value: !Ref EcsClusterTGW
        - Name: ServiceName
          Value: !GetAtt EcsServiceTGW.Name
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  OnlyOneRunningTaskCountAlarmTGW:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarmsSpokeVpc
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-OnlyOneRunningTaskCountAlarmTGW"
      AlarmDescription: !Sub
        - "Check ${Environment} frontend spoke VPC service below desired ECS service tasks. Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: true
      AlarmActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      OKActions: []
      InsufficientDataActions: []
      MetricName: RunningTaskCount
      Namespace: ECS/ContainerInsights
      Statistic: Average
      Dimensions:
        - Name: ClusterName
          Value: !Ref EcsClusterTGW
        - Name: ServiceName
          Value: !GetAtt EcsServiceTGW.Name
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 2
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  FELowContainerTaskCountAlarmTGW:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarmsSpokeVpc
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-FELowContainerTaskCountAlarmTGW"
      AlarmDescription: !Sub
        - "Trigger a warning if the spoke VPC service running container task count drops below 2. Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: true
