AWSTemplateFormatVersion: "2010-09-09"

Transform:
  - AWS::Serverless-2016-10-31
Description: >-
  This creates the necessary components to deploy Check CRI Frontend onto ECS
  Fargate within an existing VPC and private subnets (imported parameters).
  Check Front can be invoked via the public API Gateway on the url in the
  CheckFrontUrl output.

  The ingress route in summary is: API Gateway -> VPC link -> Private ALB ->
  Check Front ECS Service

  Check Front egress to Check API Gateway is via a NAT Gateway which
  should have a route in the provided private subnets' route table.

Parameters:
  PreMerge:
    Type: String
    Description: Specifies if this is a pre-merge stack
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  Environment:
    Description: The name of the environment to deploy to.
    Type: String
    AllowedPattern: ((production)|(integration)|(staging)|(build)|(dev))
  VpcStackName:
    Description: >
      The name of the stack that defines the VPC in which this container will
      run.
    Type: String
  SpokeVpcStackName:
    Description: >
      The name of the stack that defines the spoke VPC in which the spoke
      load balancer and ECS service will run. Set to "none" to disable the
      spoke VPC resources.
    Type: String
    Default: spoke-vpc
  PermissionsBoundary:
    Description: "The ARN of the permissions boundary to apply when creating IAM roles"
    Type: String
    Default: "none"

  DeployAlarmsInDevEnvironment:
    Description: "Set to the string value `true` to deploy alarms in a DEV environment"
    Type: String
    Default: false

  CodeSigningConfigArn:
    Type: String
    Description: Asserts that lambdas are signed when deployed.
    Default: "none"

  DeploymentStrategy:
    Description: "Predefined deployment configuration for ECS application"
    Type: String
    Default: "None"
    # Allowed values: See https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html

  PrivateApiGatewayId:
    Type: String
    Default: "check-hmrc-cri-api-PrivateApiGatewayId"

  ContainerImageNameOverride:
    Description: "A custom Image name for the ECS TaskDefinition - used for localdev"
    Type: String
    Default: ""

Conditions:
  IsNotPreMergeStack: !Equals [!Ref PreMerge, "false"]
  UseContainerImageNameOverride:
    !Not [!Equals [!Ref ContainerImageNameOverride, ""]]

  IsNotDevelopment: !Not
    - !Equals [!Ref Environment, dev]

  IsDevBuildEnvironment: !Or
    - !Equals [!Ref Environment, dev]
    - !Equals [!Ref Environment, build]

  IsNotDevBuildEnvironment: !Not
    - !Condition IsDevBuildEnvironment

  IsProduction: !Equals [!Ref Environment, production]

  DeployAlarms: !Or
    - !Condition IsNotDevelopment
    - !Equals [!Ref DeployAlarmsInDevEnvironment, "true"]

  UsePermissionsBoundary: !Not
    - !Equals [!Ref PermissionsBoundary, "none"]
  UseCodeSigning: !Not
    - !Equals [!Ref CodeSigningConfigArn, "none"]
  UseCanaryDeployment: !Not
    - !Equals [!Ref DeploymentStrategy, "None"]

  IsProductionOrIntegrationEnvironment: !Or
    - !Equals [!Ref Environment, production]
    - !Equals [!Ref Environment, integration]
  IsNotProductionOrIntegrationEnvironment:
    !Not [!Condition IsProductionOrIntegrationEnvironment]

  UseSpokeVpc: !And
    - !Equals
      - !FindInMap [EnvironmentConfiguration, !Ref Environment, deploySpokeVpc]
      - "true"
    - !Not [!Equals [!Ref SpokeVpcStackName, "none"]]

  IsPreMergeStack: !Equals [!Ref PreMerge, "true"]

  UseSpokeVpcPreMerge: !And
    - !Condition UseSpokeVpc
    - !Condition IsPreMergeStack

  DeployAlarmsSpokeVpc: !And
    - !Condition UseSpokeVpc
    - !Condition DeployAlarms

  DeployAlarmsSpokeVpcPreMerge: !And
    - !Condition UseSpokeVpcPreMerge
    - !Condition DeployAlarms

  IsNotDevBuildEnvironmentSpokeVpc: !And
    - !Condition UseSpokeVpc
    - !Condition IsNotDevBuildEnvironment

  UseCanaryDeploymentSpokeVpc: !And
    - !Condition UseSpokeVpc
    - !Condition UseCanaryDeployment
    - !Equals
      - !FindInMap [
          EnvironmentConfiguration,
          !Ref Environment,
          deploySpokeVpcCanary,
        ]
      - "true"

Mappings:
  StaticVariables:
    Urls:
      SupportManualURL: "https://team-manual.account.gov.uk/teams/CRI-Orange-team/supporting-cri-orange/hmrc-nino-runbook/#frontend-alarms"
  EnvironmentConfiguration:
    dev:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      minECSCount: 1
      maxECSCount: 4
      logLevel: "info"
      deploySpokeVpc: "true"
      deploySpokeVpcCanary: "false"
    build:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      minECSCount: 6
      maxECSCount: 60
      logLevel: "info"
      deploySpokeVpc: "false"
      deploySpokeVpcCanary: "false"
    staging:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      minECSCount: 2
      maxECSCount: 4
      logLevel: "warn"
      deploySpokeVpc: "false"
      deploySpokeVpcCanary: "false"
    integration:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      minECSCount: 2
      maxECSCount: 4
      logLevel: "warn"
      deploySpokeVpc: "false"
      deploySpokeVpcCanary: "false"
    production:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables
      minECSCount: 6
      maxECSCount: 60
      logLevel: "warn"
      deploySpokeVpc: "false"
      deploySpokeVpcCanary: "false"
  # see https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-access-logs.html
  ElasticLoadBalancerAccountIds:
    eu-west-2:
      AccountId: 652711504416

  PlatformConfiguration:
    dev:
      CSLSEGRESS: arn:aws:logs:eu-west-2:885513274347:destination:csls_cw_logs_destination_prodpython-2
    build:
      CSLSEGRESS: arn:aws:logs:eu-west-2:885513274347:destination:csls_cw_logs_destination_prodpython-2
    staging:
      CSLSEGRESS: arn:aws:logs:eu-west-2:885513274347:destination:csls_cw_logs_destination_prodpython-2
    integration:
      CSLSEGRESS: arn:aws:logs:eu-west-2:885513274347:destination:csls_cw_logs_destination_prodpython-2
    production:
      CSLSEGRESS: arn:aws:logs:eu-west-2:885513274347:destination:csls_cw_logs_destination_prodpython-2

Resources:
  # Security Groups for the ECS service and load balancer
  LoadBalancerSG:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: >-
        Check HMRC Front LoadBalancer Security Group
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          Description: Allow from anyone on port 80
          FromPort: 80
          IpProtocol: tcp
          ToPort: 80
      VpcId:
        Fn::ImportValue: !Sub "${VpcStackName}-VpcId"

  LoadBalancerSGEgressToECSSecurityGroup:
    Type: "AWS::EC2::SecurityGroupEgress"
    Properties:
      GroupId: !GetAtt LoadBalancerSG.GroupId
      IpProtocol: tcp
      Description: >-
        Egress between the Check HMRC Front load balancer and
        the Check HMRC Front ECS security group
      DestinationSecurityGroupId: !GetAtt ECSSecurityGroup.GroupId
      FromPort: 8080
      ToPort: 8080

  ECSSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: >-
        Check HMRC Front ECS Security Group permitting outbound
        to anywhere.
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: "-1"
      VpcId:
        Fn::ImportValue: !Sub "${VpcStackName}-VpcId"

  ECSSecurityGroupIngressFromLoadBalancer:
    Type: "AWS::EC2::SecurityGroupIngress"
    Properties:
      IpProtocol: tcp
      Description: >-
        Check HMRC Front ECS permits inbound from the Check Front
        load balancer.
      FromPort: 8080
      ToPort: 8080
      GroupId: !GetAtt ECSSecurityGroup.GroupId
      SourceSecurityGroupId: !GetAtt LoadBalancerSG.GroupId

  AccessLogsBucket:
    Condition: IsNotDevelopment
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-${Environment}-access-logs
      VersioningConfiguration:
        Status: "Enabled"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  AccessLogsBucketPolicy:
    Condition: IsNotDevelopment
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub
                - "arn:aws:iam::${ElbAccountId}:root"
                - ElbAccountId:
                    !FindInMap [
                      ElasticLoadBalancerAccountIds,
                      !Ref AWS::Region,
                      AccountId,
                    ]
            Action:
              - s3:PutObject
            Resource:
              - !Sub arn:aws:s3:::${AccessLogsBucket}/${AWS::StackName}-${Environment}/AWSLogs/${AWS::AccountId}/*
          - Effect: Deny
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub "${AccessLogsBucket.Arn}/*"
            Principal: "*"
            Action:
              - "s3:*"
            Condition:
              Bool:
                "aws:SecureTransport": false
              NumericLessThan:
                "s3:TlsVersion": "1.2"

  # Private Application Load Balancer
  LoadBalancer:
    Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
    Properties:
      Scheme: internal
      SecurityGroups:
        - !GetAtt LoadBalancerSG.GroupId
      Subnets:
        - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnetIdA"
        - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnetIdB"
      Type: application
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: true
        - !If
          - IsNotDevelopment
          - Key: access_logs.s3.enabled
            Value: true
          - !Ref AWS::NoValue
        - !If
          - IsNotDevelopment
          - Key: access_logs.s3.bucket
            Value: !Sub "di-lb-access-logs-${AWS::AccountId}-${AWS::Region}"
          - !Ref AWS::NoValue
        - !If
          - IsNotDevelopment
          - Key: access_logs.s3.prefix
            Value: !Sub ${AWS::StackName}-${Environment}
          - !Ref AWS::NoValue
      Tags:
        - Key: FMSRegionalPolicy
          Value: false
        - !If
          - IsNotProductionOrIntegrationEnvironment
          - Key: CustomPolicy
            Value: "true"
          - !Ref AWS::NoValue

  LoadBalancerListenerTargetGroupECS:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      HealthCheckEnabled: TRUE
      HealthCheckProtocol: HTTP
      HealthCheckPath: /healthcheck
      HealthCheckTimeoutSeconds: 2
      HealthCheckIntervalSeconds: 5
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub "${VpcStackName}-VpcId"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 30

  SecondLoadBalancerListenerTargetGroupECS:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      HealthCheckEnabled: TRUE
      HealthCheckProtocol: HTTP
      HealthCheckPath: /healthcheck
      HealthCheckTimeoutSeconds: 2
      HealthCheckIntervalSeconds: 5
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub "${VpcStackName}-VpcId"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 30

  LoadBalancerListener:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    # checkov:skip=CKV_AWS_2:Certificate generation must be resolved before the listener can use HTTPS.
    # checkov:skip=CKV_AWS_103:The load balancer cannot use TLS v1.2 until HTTPS is enabled
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref LoadBalancerListenerTargetGroupECS
          Type: forward
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP

  # Spoke VPC security groups, load balancer and listener.
  # Duplicates of the cri-vpc resources above, used during the migration
  # from cri-vpc to spoke-vpc. Traffic arrives from the CloudFront VPC origin.
  LoadBalancerSGTGW:
    Type: "AWS::EC2::SecurityGroup"
    Condition: UseSpokeVpc
    Properties:
      GroupDescription: >-
        Check HMRC Front spoke VPC LoadBalancer Security Group
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          Description: Allow HTTPS inbound on port 443
          FromPort: 443
          IpProtocol: tcp
          ToPort: 443
      VpcId:
        Fn::ImportValue: !Sub "${SpokeVpcStackName}-VpcId"

  # Allow HTTP for pre-merge API Gateway VPC Link testing
  LoadBalancerSGTGWHttpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseSpokeVpcPreMerge
    Properties:
      GroupId: !GetAtt LoadBalancerSGTGW.GroupId
      IpProtocol: tcp
      Description: Allow HTTP inbound on port 80
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0

  LoadBalancerSGTGWEgressToECSSecurityGroupTGW:
    Type: "AWS::EC2::SecurityGroupEgress"
    Condition: UseSpokeVpc
    Properties:
      GroupId: !GetAtt LoadBalancerSGTGW.GroupId
      IpProtocol: tcp
      Description: >-
        Egress between the Check HMRC Front spoke VPC load balancer and
        the Check HMRC Front spoke VPC ECS security group
      DestinationSecurityGroupId: !GetAtt ECSSecurityGroupTGW.GroupId
      FromPort: 8080
      ToPort: 8080

  ECSSecurityGroupTGW:
    Type: "AWS::EC2::SecurityGroup"
    Condition: UseSpokeVpc
    Properties:
      GroupDescription: >-
        Check HMRC Front spoke VPC ECS Security Group permitting outbound
        to anywhere.
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic by default
          IpProtocol: "-1"
      VpcId:
        Fn::ImportValue: !Sub "${SpokeVpcStackName}-VpcId"

  ECSSecurityGroupTGWIngressFromLoadBalancerTGW:
    Type: "AWS::EC2::SecurityGroupIngress"
    Condition: UseSpokeVpc
    Properties:
      IpProtocol: tcp
      Description: >-
        Check HMRC Front spoke VPC ECS permits inbound from the spoke VPC
        load balancer.
      FromPort: 8080
      ToPort: 8080
      GroupId: !GetAtt ECSSecurityGroupTGW.GroupId
      SourceSecurityGroupId: !GetAtt LoadBalancerSGTGW.GroupId

  # Private Application Load Balancer in the spoke VPC
  LoadBalancerTGW:
    Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
    Condition: UseSpokeVpc
    Properties:
      Scheme: internal
      SecurityGroups:
        - !GetAtt LoadBalancerSGTGW.GroupId
      Subnets:
        - Fn::ImportValue: !Sub "${SpokeVpcStackName}-PrivateSubnetIdA"
        - Fn::ImportValue: !Sub "${SpokeVpcStackName}-PrivateSubnetIdB"
        - Fn::ImportValue: !Sub "${SpokeVpcStackName}-PrivateSubnetIdC"
      Type: application
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: true
        - !If
          - IsNotDevelopment
          - Key: access_logs.s3.enabled
            Value: true
          - !Ref AWS::NoValue
        - !If
          - IsNotDevelopment
          - Key: access_logs.s3.bucket
            Value: !Sub "di-lb-access-logs-${AWS::AccountId}-${AWS::Region}"
          - !Ref AWS::NoValue
        - !If
          - IsNotDevelopment
          - Key: access_logs.s3.prefix
            Value: !Sub ${AWS::StackName}-${Environment}-tgw
          - !Ref AWS::NoValue
      Tags:
        - Key: FMSRegionalPolicy
          Value: false
        - !If
          - IsNotProductionOrIntegrationEnvironment
          - Key: CustomPolicy
            Value: "true"
          - !Ref AWS::NoValue

  LoadBalancerListenerTargetGroupECSTGW:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Condition: UseSpokeVpc
    Properties:
      HealthCheckEnabled: TRUE
      HealthCheckProtocol: HTTP
      HealthCheckPath: /healthcheck
      HealthCheckTimeoutSeconds: 2
      HealthCheckIntervalSeconds: 5
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub "${SpokeVpcStackName}-VpcId"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 30

  # Green target group used by ECSBlueGreenDeploymentStackTGW for canary
  # deployments of EcsServiceTGW.
  SecondLoadBalancerListenerTargetGroupECSTGW:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Condition: UseSpokeVpc
    Properties:
      HealthCheckEnabled: TRUE
      HealthCheckProtocol: HTTP
      HealthCheckPath: /healthcheck
      HealthCheckTimeoutSeconds: 2
      HealthCheckIntervalSeconds: 5
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub "${SpokeVpcStackName}-VpcId"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 30

  LoadBalancerListenerTGW:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Condition: UseSpokeVpc
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref LoadBalancerListenerTargetGroupECSTGW
          Type: forward
      LoadBalancerArn: !Ref LoadBalancerTGW
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !ImportValue check-hmrc-dns-records-ExternalCertificateArn

  # HTTP listener for API Gateway VPC Link integration (pre-merge testing without CloudFront)
  LoadBalancerListenerTGWHttp:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Condition: UseSpokeVpcPreMerge
    # checkov:skip=CKV_AWS_2:HTTP listener used for internal API Gateway VPC Link testing
    # checkov:skip=CKV_AWS_103:HTTP listener used for internal API Gateway VPC Link testing
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref LoadBalancerListenerTargetGroupECSTGW
          Type: forward
      LoadBalancerArn: !Ref LoadBalancerTGW
      Port: 80
      Protocol: HTTP

  # ECS cluster, service and task definition
  EcsCluster:
    Type: "AWS::ECS::Cluster"
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      CapacityProviders:
        - "FARGATE"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ECSCluster"
        - Key: Product
          Value: "GOV.UK Sign In"
        - Key: System
          Value: "Check HMRC CRI"
        - Key: Environment
          Value: !Sub "${Environment}"

  # Separate cluster for the spoke VPC service so its Container Insights
  # metrics and the cluster-level task count alarms are not mixed with
  # EcsService.
  EcsClusterTGW:
    Type: "AWS::ECS::Cluster"
    Condition: UseSpokeVpc
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      CapacityProviders:
        - "FARGATE"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ECSCluster-TGW"
        - Key: Product
          Value: "GOV.UK Sign In"
        - Key: System
          Value: "Check HMRC CRI"
        - Key: Environment
          Value: !Sub "${Environment}"

  EcsService:
    Type: AWS::ECS::Service
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3056 # We want to remove load balancers if we are doing canary deployments
    Properties:
      Cluster: !Ref EcsCluster
      DeploymentController:
        Type: !If
          - UseCanaryDeployment
          - CODE_DEPLOY
          - ECS
      DeploymentConfiguration: !If
        - UseCanaryDeployment
        - !Ref AWS::NoValue
        - MaximumPercent: 200
          MinimumHealthyPercent: 50
          DeploymentCircuitBreaker:
            Enable: TRUE
            Rollback: TRUE
      EnableECSManagedTags: false
      HealthCheckGracePeriodSeconds: 60
      LaunchType: FARGATE
      LoadBalancers: !If
        - UseCanaryDeployment
        - !Ref AWS::NoValue
        - - ContainerName: app
            ContainerPort: 8080
            TargetGroupArn: !Ref LoadBalancerListenerTargetGroupECS
      NetworkConfiguration: !If
        - UseCanaryDeployment
        - !Ref AWS::NoValue
        - AwsvpcConfiguration:
            AssignPublicIp: DISABLED
            SecurityGroups:
              - !GetAtt ECSSecurityGroup.GroupId
            Subnets:
              - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnetIdA"
              - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnetIdB"
      TaskDefinition: !If
        - UseCanaryDeployment
        - !Ref AWS::NoValue
        - !Ref ECSServiceTaskDefinition
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ECS"
        - Key: Product
          Value: "GOV.UK Sign In"
        - Key: System
          Value: "Check HMRC CRI"
        - Key: Environment
          Value: !Sub "${Environment}"
    DependsOn:
      - LoadBalancerListener

  # Spoke VPC ECS service. Mirrors EcsService: when a DeploymentStrategy is
  # set and deploySpokeVpcCanary is "true", deployments are handled by
  # ECSBlueGreenDeploymentStackTGW.
  EcsServiceTGW:
    Type: AWS::ECS::Service
    Condition: UseSpokeVpc
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3056 # We want to remove load balancers if we are doing canary deployments
    Properties:
      Cluster: !Ref EcsClusterTGW
      DeploymentController:
        Type: !If
          - UseCanaryDeploymentSpokeVpc
          - CODE_DEPLOY
          - ECS
      DeploymentConfiguration: !If
        - UseCanaryDeploymentSpokeVpc
        - !Ref AWS::NoValue
        - MaximumPercent: 200
          MinimumHealthyPercent: 50
          DeploymentCircuitBreaker:
            Enable: TRUE
            Rollback: TRUE
      EnableECSManagedTags: false
      HealthCheckGracePeriodSeconds: 60
      LaunchType: FARGATE
      LoadBalancers: !If
        - UseCanaryDeploymentSpokeVpc
        - !Ref AWS::NoValue
        - - ContainerName: app
            ContainerPort: 8080
            TargetGroupArn: !Ref LoadBalancerListenerTargetGroupECSTGW
      NetworkConfiguration: !If
        - UseCanaryDeploymentSpokeVpc
        - !Ref AWS::NoValue
        - AwsvpcConfiguration:
            AssignPublicIp: DISABLED
            SecurityGroups:
              - !GetAtt ECSSecurityGroupTGW.GroupId
            Subnets:
              - Fn::ImportValue: !Sub "${SpokeVpcStackName}-PrivateSubnetIdA"
              - Fn::ImportValue: !Sub "${SpokeVpcStackName}-PrivateSubnetIdB"
              - Fn::ImportValue: !Sub "${SpokeVpcStackName}-PrivateSubnetIdC"
      TaskDefinition: !If
        - UseCanaryDeploymentSpokeVpc
        - !Ref AWS::NoValue
        - !Ref ECSServiceTaskDefinitionTGW
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ECS-TGW"
        - Key: Product
          Value: "GOV.UK Sign In"
        - Key: System
          Value: "Check HMRC CRI"
        - Key: Environment
          Value: !Sub "${Environment}"
    DependsOn:
      - LoadBalancerListenerTGW

  ECSAccessLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/ecs/${AWS::StackName}-Front-ECS
      RetentionInDays: 365

  ECSLogsSubscriptionFilterCSLS:
    Type: AWS::Logs::SubscriptionFilter
    Condition: IsNotDevBuildEnvironment
    Properties:
      DestinationArn:
        !FindInMap [PlatformConfiguration, !Ref Environment, CSLSEGRESS]
      FilterPattern: ""
      LogGroupName: !Ref ECSAccessLogsGroup

  ECSFatalErorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ECSAccessLogsGroup
      FilterPattern: '{ $.level = "FATAL" || $.message = "Unhandled Exception:*" }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Sub "${AWS::StackName}/LogMessages"
          MetricName: "ECSFatalerror-message"

  ECSFatalErrorAlarm:
    DependsOn:
      - "ECSFatalErorMetricFilter"
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarms
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-ECSFatalErrorAlarm"
      AlarmDescription: !Sub
        - "Trigger an alarm when Fatal Error occurs. Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: true
      AlarmActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      OKActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      InsufficientDataActions: []
      MetricName: ECSFatalerror-message
      Namespace: !Sub "${AWS::StackName}/LogMessages"
      Statistic: Sum
      Dimensions: []
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Spoke VPC service logs, kept separate from ECSAccessLogsGroup so the
  # fatal error alarm identifies which service failed.
  ECSAccessLogsGroupTGW:
    Type: AWS::Logs::LogGroup
    Condition: UseSpokeVpc
    Properties:
      LogGroupName: !Sub /aws/ecs/${AWS::StackName}-Front-ECS-TGW
      RetentionInDays: 365

  ECSLogsSubscriptionFilterCSLSTGW:
    Type: AWS::Logs::SubscriptionFilter
    Condition: IsNotDevBuildEnvironmentSpokeVpc
    Properties:
      DestinationArn:
        !FindInMap [PlatformConfiguration, !Ref Environment, CSLSEGRESS]
      FilterPattern: ""
      LogGroupName: !Ref ECSAccessLogsGroupTGW

  ECSFatalErorMetricFilterTGW:
    Type: AWS::Logs::MetricFilter
    Condition: UseSpokeVpc
    Properties:
      LogGroupName: !Ref ECSAccessLogsGroupTGW
      FilterPattern: '{ $.level = "FATAL" || $.message = "Unhandled Exception:*" }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Sub "${AWS::StackName}/LogMessages"
          MetricName: "ECSFatalerror-message-TGW"

  ECSFatalErrorAlarmTGW:
    DependsOn:
      - "ECSFatalErorMetricFilterTGW"
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarmsSpokeVpc
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-ECSFatalErrorAlarmTGW"
      AlarmDescription: !Sub
        - "Trigger an alarm when Fatal Error occurs in the spoke VPC service. Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: true
      AlarmActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      OKActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      InsufficientDataActions: []
      MetricName: ECSFatalerror-message-TGW
      Namespace: !Sub "${AWS::StackName}/LogMessages"
      Statistic: Sum
      Dimensions: []
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Fargate tasks

  ECSServiceTaskDefinition:
    Type: "AWS::ECS::TaskDefinition"
    Properties:
      ContainerDefinitions:
        - Essential: true
          Image: !If
            - UseContainerImageNameOverride
            - !Ref ContainerImageNameOverride
            - CONTAINER-IMAGE-PLACEHOLDER
          Name: app
          ReadonlyRootFilesystem: true
          Environment:
            - Name: API_BASE_URL
              Value: !Sub
                - "https://${APIGatewayId}-${VpceId}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
                - APIGatewayId:
                    Fn::ImportValue: !Ref PrivateApiGatewayId
                  VpceId:
                    Fn::ImportValue: cri-vpc-ExecuteApiGatewayEndpointId
                  Environment: !Ref Environment
            - Name: BASE_URL
              Value: !GetAtt ApiGwHttpEndpoint.ApiEndpoint
            - Name: SESSION_TABLE_NAME
              Value: !Sub
                - "${AWS::StackName}-sessions-${Environment}"
                - Environment: !Ref Environment
            - Name: NODE_ENV
              Value: "production"
            - Name: GA4_CONTAINER_ID
              Value: !If [IsProduction, "GTM-K4PBJH3", "GTM-KD86CMZ"]
            - Name: FRONTEND_DOMAIN
              Value:
                !If [
                  IsProduction,
                  "account.gov.uk",
                  !Sub "${Environment}.account.gov.uk",
                ]
            - Name: MAY_2025_REBRAND_ENABLED
              Value: true
            - Name: LOG_LEVEL
              Value:
                !FindInMap [
                  EnvironmentConfiguration,
                  !Ref Environment,
                  logLevel,
                ]
            - Name: USE_PINO_LOGGER
              Value: true
          Secrets:
            - Name: DT_TENANT
              ValueFrom: !Join
                - ""
                - - !FindInMap [
                      EnvironmentConfiguration,
                      !Ref Environment,
                      dynatraceSecretArn,
                    ]
                  - ":DT_TENANT::"
            - Name: DT_TENANTTOKEN
              ValueFrom: !Join
                - ""
                - - !FindInMap [
                      EnvironmentConfiguration,
                      !Ref Environment,
                      dynatraceSecretArn,
                    ]
                  - ":DT_TENANTTOKEN::"
            - Name: DT_CONNECTION_POINT
              ValueFrom: !Join
                - ""
                - - !FindInMap [
                      EnvironmentConfiguration,
                      !Ref Environment,
                      dynatraceSecretArn,
                    ]
                  - ":DT_CONNECTION_POINT::"
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSAccessLogsGroup
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: !Sub ${AWS::StackName}-${Environment}
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8080/healthcheck || exit 1 # If a HealthCheck returns a non-zero exit code, then it's considered unhealthy.
            Interval: 10
            Timeout: 2
            Retries: 10 # This ensures that just one healthcheck failure won't cause the container to be drained and replaced.
            StartPeriod: 0
      Cpu: "2048"
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      Memory: "4096"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: "X86_64"
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-TaskDefinition"
        - Key: Product
          Value: "GOV.UK Sign In"
        - Key: System
          Value: "Check HMRC CRI"
        - Key: Environment
          Value: !Sub "${Environment}"

  # Spoke VPC task definition. Identical to ECSServiceTaskDefinition except
  # API_BASE_URL uses the spoke VPC execute-api endpoint, and logs use a
  # separate stream prefix. Keep the two in sync.
  ECSServiceTaskDefinitionTGW:
    Type: "AWS::ECS::TaskDefinition"
    Condition: UseSpokeVpc
    Properties:
      ContainerDefinitions:
        - Essential: true
          Image: !If
            - UseContainerImageNameOverride
            - !Ref ContainerImageNameOverride
            - CONTAINER-IMAGE-PLACEHOLDER
          Name: app
          ReadonlyRootFilesystem: true
          Environment:
            - Name: API_BASE_URL
              Value: !Sub
                - "https://${APIGatewayId}-${VpceId}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
                - APIGatewayId:
                    Fn::ImportValue: !Ref PrivateApiGatewayId
                  VpceId:
                    Fn::ImportValue: !Sub "${SpokeVpcStackName}-ExecuteApiGatewayEndpointId"
                  Environment: !Ref Environment
            - Name: SESSION_TABLE_NAME
              Value: !Sub
                - "${AWS::StackName}-sessions-${Environment}"
                - Environment: !Ref Environment
            - Name: NODE_ENV
              Value: "production"
            - Name: GA4_CONTAINER_ID
              Value: !If [IsProduction, "GTM-K4PBJH3", "GTM-KD86CMZ"]
            - Name: FRONTEND_DOMAIN
              Value:
                !If [
                  IsProduction,
                  "account.gov.uk",
                  !Sub "${Environment}.account.gov.uk",
                ]
            - Name: MAY_2025_REBRAND_ENABLED
              Value: true
            - Name: LOG_LEVEL
              Value:
                !FindInMap [
                  EnvironmentConfiguration,
                  !Ref Environment,
                  logLevel,
                ]
            - Name: USE_PINO_LOGGER
              Value: true
          Secrets:
            - Name: DT_TENANT
              ValueFrom: !Join
                - ""
                - - !FindInMap [
                      EnvironmentConfiguration,
                      !Ref Environment,
                      dynatraceSecretArn,
                    ]
                  - ":DT_TENANT::"
            - Name: DT_TENANTTOKEN
              ValueFrom: !Join
                - ""
                - - !FindInMap [
                      EnvironmentConfiguration,
                      !Ref Environment,
                      dynatraceSecretArn,
                    ]
                  - ":DT_TENANTTOKEN::"
            - Name: DT_CONNECTION_POINT
              ValueFrom: !Join
                - ""
                - - !FindInMap [
                      EnvironmentConfiguration,
                      !Ref Environment,
                      dynatraceSecretArn,
                    ]
                  - ":DT_CONNECTION_POINT::"
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSAccessLogsGroupTGW
              awslogs-region: !Sub ${AWS::Region}
              awslogs-stream-prefix: !Sub ${AWS::StackName}-${Environment}-tgw
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8080/healthcheck || exit 1 # If a HealthCheck returns a non-zero exit code, then it's considered unhealthy.
            Interval: 10
            Timeout: 2
            Retries: 10 # This ensures that just one healthcheck failure won't cause the container to be drained and replaced.
            StartPeriod: 0
      Cpu: "2048"
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRoleTGW.Arn
      Memory: "4096"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: "X86_64"
      TaskRoleArn: !GetAtt ECSTaskRoleTGW.Arn
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-TaskDefinition-TGW"
        - Key: Product
          Value: "GOV.UK Sign In"
        - Key: System
          Value: "Check HMRC CRI"
        - Key: Environment
          Value: !Sub "${Environment}"

  ECSTaskExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: "sts:AssumeRole"
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
        Version: 2012-10-17
      Policies:
        - PolicyName: PullFrontImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ecr:BatchGetImage"
                  - "ecr:GetDownloadUrlForLayer"
                  - "ecr:GetAuthorizationToken"
                Resource:
                  - "*"
              - Effect: Allow
                Action:
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !GetAtt "ECSAccessLogsGroup.Arn"
                  - !Sub "${ECSAccessLogsGroup.Arn}:*"
        - PolicyName: DynatraceGetSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue" #pragma: allowlist secret
                Resource:
                  - "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables*"
                  - "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables*"
              - Effect: Allow
                Action:
                  - "secretsmanager:ListSecrets" #pragma: allowlist secret
                Resource:
                  - "arn:aws:secretsmanager:eu-west-2:216552277552:secret:*"
              - Effect: Allow
                Action:
                  - "kms:Decrypt"
                Resource:
                  - "arn:aws:kms:eu-west-2:216552277552:key/*"
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue

  ECSTaskRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: "sts:AssumeRole"
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
        Version: 2012-10-17
      Policies:
        - PolicyName: DynamoDBSessionAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:BatchGetItem"
                  - "dynamodb:DescribeTable"
                  - "dynamodb:GetItem"
                  - "dynamodb:Query"
                  - "dynamodb:Scan"
                  - "dynamodb:BatchWriteItem"
                  - "dynamodb:DeleteItem"
                  - "dynamodb:UpdateItem"
                  - "dynamodb:PutItem"
                Resource:
                  - !GetAtt SessionsTable.Arn
        - PolicyName: DynatraceGetSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue" #pragma: allowlist secret
                Resource:
                  - "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables*"
                  - "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables*"
              - Effect: Allow
                Action:
                  - "secretsmanager:ListSecrets" #pragma: allowlist secret
                Resource:
                  - "arn:aws:secretsmanager:eu-west-2:216552277552:secret:*"
              - Effect: Allow
                Action:
                  - "kms:Decrypt"
                Resource:
                  - "arn:aws:kms:eu-west-2:216552277552:key/*"
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue

  # Spoke VPC task roles. Same permissions as ECSTaskExecutionRole and
  # ECSTaskRole, except logs are written to ECSAccessLogsGroupTGW.
  ECSTaskExecutionRoleTGW:
    Type: "AWS::IAM::Role"
    Condition: UseSpokeVpc
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: "sts:AssumeRole"
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
        Version: 2012-10-17
      Policies:
        - PolicyName: PullFrontImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ecr:BatchGetImage"
                  - "ecr:GetDownloadUrlForLayer"
                  - "ecr:GetAuthorizationToken"
                Resource:
                  - "*"
              - Effect: Allow
                Action:
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !GetAtt "ECSAccessLogsGroupTGW.Arn"
                  - !Sub "${ECSAccessLogsGroupTGW.Arn}:*"
        - PolicyName: DynatraceGetSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue" #pragma: allowlist secret
                Resource:
                  - "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables*"
                  - "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables*"
              - Effect: Allow
                Action:
                  - "secretsmanager:ListSecrets" #pragma: allowlist secret
                Resource:
                  - "arn:aws:secretsmanager:eu-west-2:216552277552:secret:*"
              - Effect: Allow
                Action:
                  - "kms:Decrypt"
                Resource:
                  - "arn:aws:kms:eu-west-2:216552277552:key/*"
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue

  # SessionsTable is shared on purpose: both services must read the same
  # sessions so journeys survive the CloudFront origin switch.
  ECSTaskRoleTGW:
    Type: "AWS::IAM::Role"
    Condition: UseSpokeVpc
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: "sts:AssumeRole"
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
        Version: 2012-10-17
      Policies:
        - PolicyName: DynamoDBSessionAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:BatchGetItem"
                  - "dynamodb:DescribeTable"
                  - "dynamodb:GetItem"
                  - "dynamodb:Query"
                  - "dynamodb:Scan"
                  - "dynamodb:BatchWriteItem"
                  - "dynamodb:DeleteItem"
                  - "dynamodb:UpdateItem"
                  - "dynamodb:PutItem"
                Resource:
                  - !GetAtt SessionsTable.Arn
        - PolicyName: DynatraceGetSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue" #pragma: allowlist secret
                Resource:
                  - "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables*"
                  - "arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables*"
              - Effect: Allow
                Action:
                  - "secretsmanager:ListSecrets" #pragma: allowlist secret
                Resource:
                  - "arn:aws:secretsmanager:eu-west-2:216552277552:secret:*"
              - Effect: Allow
                Action:
                  - "kms:Decrypt"
                Resource:
                  - "arn:aws:kms:eu-west-2:216552277552:key/*"
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue

  # Create the VPC Link to join the API Gateway to the
  # private Load Balancer in front of Passport Front ECS
  # Service.
  VpcLink:
    Type: "AWS::ApiGatewayV2::VpcLink"
    Properties:
      Name: ApiGwVpcLinkToLoadBalancer
      SubnetIds:
        - Fn::ImportValue: !Sub ${VpcStackName}-PrivateSubnetIdA
        - Fn::ImportValue: !Sub ${VpcStackName}-PrivateSubnetIdB
      SecurityGroupIds: []

  # VPC Link for Spoke VPC - used for pre-merge testing without CloudFront
  VpcLinkTGW:
    Type: AWS::ApiGatewayV2::VpcLink
    Condition: UseSpokeVpcPreMerge
    Properties:
      Name: ApiGwVpcLinkToLoadBalancerTGW
      SubnetIds:
        - Fn::ImportValue: !Sub ${SpokeVpcStackName}-PrivateSubnetIdA
        - Fn::ImportValue: !Sub ${SpokeVpcStackName}-PrivateSubnetIdB
        - Fn::ImportValue: !Sub ${SpokeVpcStackName}-PrivateSubnetIdC
      SecurityGroupIds: []

  ApiGwHttpEndpoint:
    Type: "AWS::ApiGatewayV2::Api"
    Properties:
      Name: !Sub ${AWS::StackName}-${Environment}
      ProtocolType: HTTP
      Tags:
        FMSRegionalPolicy: false
        CustomPolicy: !If
          - IsNotProductionOrIntegrationEnvironment
          - "true"
          - !Ref AWS::NoValue

  ApiGwHttpEndpointIntegration:
    Type: "AWS::ApiGatewayV2::Integration"
    Properties:
      ApiId: !Ref ApiGwHttpEndpoint
      IntegrationType: HTTP_PROXY
      ConnectionId:
        Fn::ImportValue: !Sub "${VpcStackName}-VpcLinkId"
      ConnectionType: VPC_LINK
      IntegrationMethod: ANY
      IntegrationUri: !Ref LoadBalancerListener
      PayloadFormatVersion: "1.0"

  APIGWRoute:
    Type: "AWS::ApiGatewayV2::Route"
    Properties:
      ApiId: !Ref ApiGwHttpEndpoint
      RouteKey: "ANY /{proxy+}"
      Target: !Join
        - /
        - - integrations
          - !Ref ApiGwHttpEndpointIntegration

  APIStageDefault:
    Type: "AWS::ApiGatewayV2::Stage"
    Properties:
      ApiId: !Ref ApiGwHttpEndpoint
      StageName: $default
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt APIGWAccessLogsGroup.Arn
        Format: >-
          {
          "requestId":"$context.requestId",
          "ip": "$context.identity.sourceIp",
          "requestTime":"$context.requestTime",
          "httpMethod":"$context.httpMethod",
          "path": "$context.path",
          "routeKey":"$context.routeKey",
          "status":"$context.status",
          "protocol":"$context.protocol",
          "responseLength":"$context.responseLength",
          "responseLatency":"$context.responseLatency"
          }
      Tags:
        FMSRegionalPolicy: false
        CustomPolicy: !If
          - IsNotProductionOrIntegrationEnvironment
          - "true"
          - !Ref AWS::NoValue

  APIGWAccessLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-API-GW-AccessLogs
      RetentionInDays: 365

  APIGWLogsSubscriptionFilterCSLS:
    Type: AWS::Logs::SubscriptionFilter
    Condition: IsNotDevBuildEnvironment
    Properties:
      DestinationArn:
        !FindInMap [PlatformConfiguration, !Ref Environment, CSLSEGRESS]
      FilterPattern: ""
      LogGroupName: !Ref APIGWAccessLogsGroup

  # No CSLS subscription filter: this log group only exists in pre-merge
  # stacks, which are always dev, and CSLS is not used in dev or build.
  APIGWAccessLogsGroupTGW:
    Type: AWS::Logs::LogGroup
    Condition: UseSpokeVpcPreMerge
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-API-GW-AccessLogs-TGW
      RetentionInDays: 365

  # API Gateway for Spoke VPC - used for pre-merge testing without CloudFront
  ApiGwHttpEndpointTGW:
    Type: "AWS::ApiGatewayV2::Api"
    Condition: UseSpokeVpcPreMerge
    Properties:
      Name: !Sub ${AWS::StackName}-${Environment}-tgw
      ProtocolType: HTTP
      Tags:
        FMSRegionalPolicy: false
        CustomPolicy: !If
          - IsNotProductionOrIntegrationEnvironment
          - "true"
          - !Ref AWS::NoValue

  ApiGwHttpEndpointIntegrationTGW:
    Type: AWS::ApiGatewayV2::Integration
    Condition: UseSpokeVpcPreMerge
    Properties:
      ApiId: !Ref ApiGwHttpEndpointTGW
      IntegrationType: HTTP_PROXY
      ConnectionId: !Ref VpcLinkTGW
      ConnectionType: VPC_LINK
      IntegrationMethod: ANY
      IntegrationUri: !Ref LoadBalancerListenerTGWHttp
      PayloadFormatVersion: "1.0"

  APIGWRouteTGW:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseSpokeVpcPreMerge
    Properties:
      ApiId: !Ref ApiGwHttpEndpointTGW
      RouteKey: "ANY /{proxy+}"
      Target: !Join
        - /
        - - integrations
          - !Ref ApiGwHttpEndpointIntegrationTGW

  APIStageDefaultTGW:
    Type: "AWS::ApiGatewayV2::Stage"
    Condition: UseSpokeVpcPreMerge
    Properties:
      ApiId: !Ref ApiGwHttpEndpointTGW
      StageName: $default
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt APIGWAccessLogsGroupTGW.Arn
        Format: >-
          {
          "requestId":"$context.requestId",
          "ip": "$context.identity.sourceIp",
          "requestTime":"$context.requestTime",
          "httpMethod":"$context.httpMethod",
          "path": "$context.path",
          "routeKey":"$context.routeKey",
          "status":"$context.status",
          "protocol":"$context.protocol",
          "responseLength":"$context.responseLength",
          "responseLatency":"$context.responseLatency"
          }
      Tags:
        FMSRegionalPolicy: false
        CustomPolicy: !If
          - IsNotProductionOrIntegrationEnvironment
          - "true"
          - !Ref AWS::NoValue

  APIGWFatalErorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref APIGWAccessLogsGroup
      FilterPattern: '{ $.level = "FATAL" || $.message = "Unhandled Exception:*" }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Sub "${AWS::StackName}/LogMessages"
          MetricName: "APIGWFatalerror-message"

  APIGWFatalErrorAlarm:
    DependsOn:
      - "APIGWFatalErorMetricFilter"
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarms
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-APIGWFatalErrorAlarm"
      AlarmDescription: !Sub
        - "Trigger an alarm when Fatal Error occurs. Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: true
      AlarmActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      OKActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      InsufficientDataActions: []
      MetricName: APIGWFatalerror-message
      Namespace: !Sub "${AWS::StackName}/LogMessages"
      Statistic: Sum
      Dimensions: []
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  APIGWFatalErorMetricFilterTGW:
    Type: AWS::Logs::MetricFilter
    Condition: UseSpokeVpcPreMerge
    Properties:
      LogGroupName: !Ref APIGWAccessLogsGroupTGW
      FilterPattern: '{ $.level = "FATAL" || $.message = "Unhandled Exception:*" }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Sub "${AWS::StackName}/LogMessages"
          MetricName: "APIGWFatalerror-message-TGW"

  APIGWFatalErrorAlarmTGW:
    DependsOn:
      - "APIGWFatalErorMetricFilterTGW"
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarmsSpokeVpcPreMerge
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-APIGWFatalErrorAlarmTGW"
      AlarmDescription: !Sub
        - "Trigger an alarm when Fatal Error occurs in the spoke VPC pre-merge API Gateway. Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: true
      AlarmActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      OKActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      InsufficientDataActions: []
      MetricName: APIGWFatalerror-message-TGW
      Namespace: !Sub "${AWS::StackName}/LogMessages"
      Statistic: Sum
      Dimensions: []
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CloudFrontWAFv2ACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: IsNotPreMergeStack
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !ImportValue cfront-origin-distrib-CloakingOriginWebACLArn

  # ECS Autoscaling

  ECSAutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity:
        !FindInMap [EnvironmentConfiguration, !Ref Environment, minECSCount]
      MaxCapacity:
        !FindInMap [EnvironmentConfiguration, !Ref Environment, maxECSCount]
      ResourceId: !Sub service/${EcsCluster}/${EcsService.Name}
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ECSPredictiveScalingPolicy:
    DependsOn: ECSAutoScalingTarget
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: ECSPredictiveScalingPolicy
      PolicyType: PredictiveScaling
      ResourceId: !Sub service/${EcsCluster}/${EcsService.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      PredictiveScalingPolicyConfiguration:
        MaxCapacityBreachBehavior: HonorMaxCapacity
        MetricSpecifications:
          - PredefinedMetricPairSpecification:
              PredefinedMetricType: ECSServiceCPUUtilization
            TargetValue: 25
        Mode: ForecastOnly
        SchedulingBufferTime: 600

  StepScaleInPolicy:
    DependsOn: ECSAutoScalingTarget
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: StepScalingInPolicy
      PolicyType: StepScaling
      ResourceId: !Sub service/${EcsCluster}/${EcsService.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      StepScalingPolicyConfiguration:
        AdjustmentType: PercentChangeInCapacity
        Cooldown: 300
        StepAdjustments:
          - MetricIntervalUpperBound: -10
            MetricIntervalLowerBound: -20
            ScalingAdjustment: -10
          - MetricIntervalUpperBound: -20
            ScalingAdjustment: -50

  StepScaleOutPolicy:
    DependsOn: ECSAutoScalingTarget
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: StepScalingOutPolicy
      PolicyType: StepScaling
      ResourceId: !Sub service/${EcsCluster}/${EcsService.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      StepScalingPolicyConfiguration:
        AdjustmentType: PercentChangeInCapacity
        Cooldown: 60
        MinAdjustmentMagnitude: 3
        StepAdjustments: #these bounds are tuned to 2 CPU instances because node will max one CPU
          - MetricIntervalUpperBound: 10
            ScalingAdjustment: 100
          - MetricIntervalLowerBound: 10
            MetricIntervalUpperBound: 15
            ScalingAdjustment: 200
          - MetricIntervalLowerBound: 15
            ScalingAdjustment: 500

  StepScaleOutAlarm:
    DependsOn: ECSAutoScalingTarget
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !Ref StepScaleOutPolicy
      AlarmDescription: "FrontClusterOver30PercentCPU"
      ComparisonOperator: "GreaterThanThreshold"
      DatapointsToAlarm: "1"
      Dimensions:
        - Name: ClusterName
          Value: !Ref EcsCluster
        - Name: ServiceName
          Value: !GetAtt EcsService.Name
      Unit: "Percent"
      EvaluationPeriods: "1"
      MetricName: "CPUUtilization"
      Namespace: "AWS/ECS"
      Statistic: "Average"
      Period: "60"
      Threshold: "30"

  StepScaleInAlarm:
    DependsOn: ECSAutoScalingTarget
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !Ref StepScaleInPolicy
      AlarmDescription: "FrontClusterUnder30PercentCPU"
      ComparisonOperator: "LessThanThreshold"
      DatapointsToAlarm: "5"
      Dimensions:
        - Name: ClusterName
          Value: !Ref EcsCluster
        - Name: ServiceName
          Value: !GetAtt EcsService.Name
      Unit: "Percent"
      EvaluationPeriods: "5"
      MetricName: "CPUUtilization"
      Namespace: "AWS/ECS"
      Statistic: "Average"
      Period: "60"
      Threshold: "30"

  # Spoke VPC ECS Autoscaling

  ECSAutoScalingTargetTGW:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: UseSpokeVpc
    Properties:
      MinCapacity:
        !FindInMap [EnvironmentConfiguration, !Ref Environment, minECSCount]
      MaxCapacity:
        !FindInMap [EnvironmentConfiguration, !Ref Environment, maxECSCount]
      ResourceId: !Sub service/${EcsClusterTGW}/${EcsServiceTGW.Name}
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ECSPredictiveScalingPolicyTGW:
    DependsOn: ECSAutoScalingTargetTGW
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: UseSpokeVpc
    Properties:
      PolicyName: ECSPredictiveScalingPolicyTGW
      PolicyType: PredictiveScaling
      ResourceId: !Sub service/${EcsClusterTGW}/${EcsServiceTGW.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      PredictiveScalingPolicyConfiguration:
        MaxCapacityBreachBehavior: HonorMaxCapacity
        MetricSpecifications:
          - PredefinedMetricPairSpecification:
              PredefinedMetricType: ECSServiceCPUUtilization
            TargetValue: 25
        Mode: ForecastOnly
        SchedulingBufferTime: 600

  StepScaleInPolicyTGW:
    DependsOn: ECSAutoScalingTargetTGW
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: UseSpokeVpc
    Properties:
      PolicyName: StepScalingInPolicyTGW
      PolicyType: StepScaling
      ResourceId: !Sub service/${EcsClusterTGW}/${EcsServiceTGW.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      StepScalingPolicyConfiguration:
        AdjustmentType: PercentChangeInCapacity
        Cooldown: 300
        StepAdjustments:
          - MetricIntervalUpperBound: -10
            MetricIntervalLowerBound: -20
            ScalingAdjustment: -10
          - MetricIntervalUpperBound: -20
            ScalingAdjustment: -50

  StepScaleOutPolicyTGW:
    DependsOn: ECSAutoScalingTargetTGW
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: UseSpokeVpc
    Properties:
      PolicyName: StepScalingOutPolicyTGW
      PolicyType: StepScaling
      ResourceId: !Sub service/${EcsClusterTGW}/${EcsServiceTGW.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      StepScalingPolicyConfiguration:
        AdjustmentType: PercentChangeInCapacity
        Cooldown: 60
        MinAdjustmentMagnitude: 3
        StepAdjustments: #these bounds are tuned to 2 CPU instances because node will max one CPU
          - MetricIntervalUpperBound: 10
            ScalingAdjustment: 100
          - MetricIntervalLowerBound: 10
            MetricIntervalUpperBound: 15
            ScalingAdjustment: 200
          - MetricIntervalLowerBound: 15
            ScalingAdjustment: 500

  StepScaleOutAlarmTGW:
    DependsOn: ECSAutoScalingTargetTGW
    Type: AWS::CloudWatch::Alarm
    Condition: UseSpokeVpc
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !Ref StepScaleOutPolicyTGW
      AlarmDescription: "FrontTGWServiceOver30PercentCPU"
      ComparisonOperator: "GreaterThanThreshold"
      DatapointsToAlarm: "1"
      Dimensions:
        - Name: ClusterName
          Value: !Ref EcsClusterTGW
        - Name: ServiceName
          Value: !GetAtt EcsServiceTGW.Name
      Unit: "Percent"
      EvaluationPeriods: "1"
      MetricName: "CPUUtilization"
      Namespace: "AWS/ECS"
      Statistic: "Average"
      Period: "60"
      Threshold: "30"

  StepScaleInAlarmTGW:
    DependsOn: ECSAutoScalingTargetTGW
    Type: AWS::CloudWatch::Alarm
    Condition: UseSpokeVpc
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !Ref StepScaleInPolicyTGW
      AlarmDescription: "FrontTGWServiceUnder30PercentCPU"
      ComparisonOperator: "LessThanThreshold"
      DatapointsToAlarm: "5"
      Dimensions:
        - Name: ClusterName
          Value: !Ref EcsClusterTGW
        - Name: ServiceName
          Value: !GetAtt EcsServiceTGW.Name
      Unit: "Percent"
      EvaluationPeriods: "5"
      MetricName: "CPUUtilization"
      Namespace: "AWS/ECS"
      Statistic: "Average"
      Period: "60"
      Threshold: "30"

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # checkov:skip=CKV_AWS_28: Point in time recovery is not necessary for this table.
      TableName: !Sub "${AWS::StackName}-sessions-${Environment}"
      BillingMode: "PAY_PER_REQUEST"
      AttributeDefinitions:
        - AttributeName: "id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "id"
          KeyType: "HASH"
      TimeToLiveSpecification:
        AttributeName: "expires"
        Enabled: true
      SSESpecification:
        # checkov:skip=CKV_AWS_119: Implement Customer Managed Keys in PYIC-1391
        SSEEnabled: true
        SSEType: KMS

  FE5XXErrorCriticalAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarms
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-FE5XXErrorCriticalAlarm"
      AlarmDescription: !Sub
        - "Threshold exceeds 80% with a minimum of at least 5 invocations in 2 out of the last 5 evaluation periods of (15mins each). Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: true
      AlarmActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      OKActions:
        - !ImportValue build-notifications-CriticalAlertsTopicArn
        - !If [
            IsProduction,
            !ImportValue build-notifications-PagerDutySNSTopicArn,
            !Ref "AWS::NoValue",
          ]
      EvaluationPeriods: 5
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: errorThreshold
          Label: errorThreshold
          ReturnData: true
          Expression: IF(invocations >= 5, errorPercentage, 0)
        - Id: errorPercentage
          Label: errorPercentage
          ReturnData: false
          Expression: (error / invocations) * 100
        - Id: invocations
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: Count
              Dimensions:
                - Name: ApiId
                  Value: !Ref ApiGwHttpEndpoint
            Period: 900
            Stat: Sum
        - Id: error
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: 5xx
              Dimensions:
                - Name: ApiId
                  Value: !Ref ApiGwHttpEndpoint
            Period: 900
            Stat: Sum

  FE4XXErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarms
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-FE4XXErrorAlarm"
      AlarmDescription: !Sub
        - "Error threshold exceeds 5% with a minimum of 150 invocations and a minimum of 2 errors in 2 out of the last 5 minutes. Runbook: ${SupportManualURL}"
        - SupportManualURL: !FindInMap [StaticVariables, Urls, SupportManualURL]
      ActionsEnabled: true
      OKActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      AlarmActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      InsufficientDataActions: []
      EvaluationPeriods: 5
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: errorThreshold
          Label: errorThreshold
          ReturnData: true
          Expression: IF(invocations<150 || error<2,0,errorPercentage)
        - Id: invocations
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: Count
              Dimensions:
                - Name: ApiId
                  Value: !Ref ApiGwHttpEndpoint
            Period: 60
            Stat: Sum
        - Id: error
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: 4xx
              Dimensions:
                - Name: ApiId
                  Value: !Ref ApiGwHttpEndpoint
            Period: 60
            Stat: Sum
        - Id: errorPercentage
          Label: errorPercentage
          ReturnData: false
          Expression: (error/invocations) * 100

  FELatencyAlarmP95:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployAlarms
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-FELatencyAlarmP95"
      AlarmDescription: !Sub
        - "Trigger the alarm if less than 95% of requests has a latency of more than 1 second with a minimum of 25 invocations in 2 out of the last 5 minutes. Runbook: ${SupportManualURL}"
