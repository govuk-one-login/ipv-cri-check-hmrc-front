name: check-hmrc-cri-front
services:
  mocks:
    container_name: mocks
    image: outofcoffee/imposter:3.25.1
    volumes:
      - "../imposter:/opt/imposter/config"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport"
      IMPOSTER_LOG_SUMMARY: TRUE
      IMPOSTER_LOG_RESPONSE_BODY: true

  frontend:
    container_name: frontend
    build:
      context: ../..
      dockerfile: local.Dockerfile
    environment:
      REDIS_SESSION_URL: db
      API_BASE_URL: http://mocks:8080
      PORT: 5050
      NODE_ENV: development
      DEVICE_INTELLIGENCE_DOMAIN: localhost
    ports:
      - "5050:5050"
    depends_on:
      - mocks

  cucumber:
    container_name: cucumber
    build:
      context: ../..
      dockerfile: test/browser/pre-merge.Dockerfile
    environment:
      USE_LOCAL_API: ${USE_LOCAL_API:-true}
      GITHUB_ACTIONS: true
      WEBSITE_HOST: ${WEBSITE_HOST:-http://frontend:5050}
      RELYING_PARTY_URL: ${RELYING_PARTY_URL:-http://ipv-core-stub:8085}
      BROWSER: ${BROWSER:-chromium}

      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

    volumes:
      - ./reports:/reports

  visual:
    container_name: visual
    build:
      context: ../..
      dockerfile: test/browser/pre-merge.Dockerfile
    environment:
      USE_LOCAL_API: true
      GITHUB_ACTIONS: true
      WEBSITE_HOST: http://frontend:5050
      RELYING_PARTY_URL: "http://ipv-core-stub:8085"
      BROWSER: ${BROWSER:-chromium}
    volumes:
      - ../../test/visual/snapshots:/app/test/visual/snapshots
    depends_on:
      - mocks
      - frontend
    command: ["npm", "run", "test:visual"]

  ipv-core-stub:
    container_name: ipv-core-stub
    build:
      context: ../../../ipv-stubs/di-ipv-core-stub/
      dockerfile: Dockerfile-arm64
      target: nodynatrace
      no_cache: true
    ports:
      - "8085:8085"
    environment:
      - CORE_STUB_CONFIG_FILE=/app/config/di-ipv-config.yaml
    env_file:
      - ../../../ipv-config/stubs/di-ipv-core-stub/.env
    volumes:
      - ../../../ipv-config/stubs/di-ipv-core-stub:/app/config
      - ../browser/di-ipv-config.yaml:/app/config/di-ipv-config.yaml
    profiles:
      - core-stub
